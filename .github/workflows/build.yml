name: Build Multi-Platform Desktop App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as Release Draft'
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller SmartTKAScanner.spec --noconfirm

      - name: Prepare Package Folders and Installer
        run: |
          New-Item -ItemType Directory -Force -Path dist\SmartTKAScanner\inbox
          New-Item -ItemType Directory -Force -Path dist\SmartTKAScanner\processed
          New-Item -ItemType Directory -Force -Path dist\SmartTKAScanner\logs
          Copy-Item settings.example.json dist\SmartTKAScanner\settings.example.json
          Compress-Archive -Path dist\SmartTKAScanner\* -DestinationPath SmartTKAScanner-Windows-x64.zip
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc SmartTKAScanner.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" SmartTKAScanner.iss
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTKAScanner-Windows-x64
          path: |
            SmartTKAScanner-Windows-x64.zip
            SmartTKAScanner-Setup-*.exe

  build-macos:
    name: Build macOS (Universal/arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Tools & Tesseract
        run: |
          brew install tesseract tesseract-lang

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller SmartTKAScanner.spec --noconfirm

      - name: Package macOS App
        run: |
          cd dist
          zip -r -q ../SmartTKAScanner-macOS.zip SmartTKAScanner.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTKAScanner-macOS
          path: SmartTKAScanner-macOS.zip

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind libgtk-3-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller SmartTKAScanner.spec --noconfirm

      - name: Package Linux Binary
        run: |
          mkdir -p dist/SmartTKAScanner/inbox dist/SmartTKAScanner/processed dist/SmartTKAScanner/logs
          cp settings.example.json dist/SmartTKAScanner/
          tar -czf SmartTKAScanner-Linux-x64.tar.gz -C dist SmartTKAScanner

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTKAScanner-Linux-x64
          path: SmartTKAScanner-Linux-x64.tar.gz

  create-release:
    name: Publish GitHub Release
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartTKAScanner-Windows-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartTKAScanner-macOS

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartTKAScanner-Linux-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            SmartTKAScanner-Setup-*.exe
            SmartTKAScanner-Windows-x64.zip
            SmartTKAScanner-macOS.zip
            SmartTKAScanner-Linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
